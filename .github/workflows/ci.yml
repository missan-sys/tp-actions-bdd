name: CI Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: préparer la base de données
        run: bash db/setup.sh

      - name: installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: installer les dépendances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: lancer les tests
        run: pytest -v
        working-directory: python-app
